name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer install / launch / uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/orgFiles-Setup-*.exe | Select-Object -First 1).FullName
          $installDir = "$env:LOCALAPPDATA\orgFiles-smoke"
          $env:ORGFILES_LIBRARY = "$env:RUNNER_TEMP\orgFiles-installed-test"
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait
          $app = Join-Path $installDir 'orgFiles.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw 'Installed app quit unexpectedly' }
          if (!(Test-Path "$env:ORGFILES_LIBRARY\catalog.json")) { throw 'Installed app did not initialize library' }
          Stop-Process -Id $proc.Id -Force
          Get-Process orgFiles -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = (Get-ChildItem $installDir -Filter '*Uninstall*.exe' | Select-Object -First 1).FullName
          if (!$uninstaller) { throw 'Uninstaller missing' }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 4
          if (!(Test-Path "$env:ORGFILES_LIBRARY\catalog.json")) { throw 'Uninstall removed user library' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/orgFiles-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: orgFiles-Windows-x64
          path: |
            dist/orgFiles-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/orgFiles-Setup-*.exe dist/SHA256SUMS.txt --title "orgFiles $tag" --notes-file RELEASE_NOTES.md --verify-tag
